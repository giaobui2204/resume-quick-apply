<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyPilot</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #15221d; }
      body { margin: 0; width: 340px; background: #fbfaf6; }
      header { background: #15221d; color: white; padding: 18px; }
      header strong { color: #cde566; }
      header p { margin: 4px 0 0; color: #acb8b2; font-size: 11px; }
      main { padding: 17px; }
      label { display: block; font-size: 10px; font-weight: 700; margin: 11px 0; }
      input { width: 100%; box-sizing: border-box; margin-top: 5px; padding: 9px; border: 1px solid #ccd1c8; border-radius: 3px; }
      button { width: 100%; border: 0; padding: 11px; background: #cde566; color: #15221d; font-weight: 800; border-radius: 3px; cursor: pointer; }
      .note { margin: 13px 0; padding: 10px; background: #eef1e9; font-size: 10px; line-height: 1.5; }
      #status { min-height: 15px; color: #39704d; font-size: 10px; margin-top: 9px; }
    </style>
  </head>
  <body>
    <header><strong>ApplyPilot</strong><p>Verified facts only. Review before submit.</p></header>
    <main>
      <label>Legal name<input id="legalName" autocomplete="name"></label>
      <label>Email<input id="email" type="email" autocomplete="email"></label>
      <label>Phone<input id="phone" autocomplete="tel"></label>
      <label>LinkedIn URL<input id="linkedIn" type="url"></label>
      <label>Current location<input id="location"></label>
      <div class="note">This local MVP stores these values in Chrome. The production pairing flow will sync your encrypted web profile.</div>
      <button id="save">Save verified profile</button>
      <div id="status" role="status"></div>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
