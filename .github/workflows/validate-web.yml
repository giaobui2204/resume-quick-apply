name: Validate web deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared workspace package
        run: npm run build -w @quick-apply/shared
      - name: Build Next.js app
        run: npm run build -w @quick-apply/web
      - name: Typecheck workspaces
        run: npm run typecheck
